[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandpile"
version = "1.0.0"
description = "Abelian sandpile model on Z^2: vectorised stabilisation, abelian property checks, self-organised criticality"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Selima Klibi"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["sandpile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
